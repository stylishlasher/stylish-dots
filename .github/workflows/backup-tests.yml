name: backup-tests
on:
  push:
    paths:
      - 'modules/lib/common.sh'
      - 'modules/lib/i18n.sh'
      - 'modules/actions/backup.sh'
      - 'modules/actions/uninstall.sh'
      - 'install/install.sh'
      - 'install/install_debian.sh'
      - 'tests/backup-tests.sh'
      - 'tests/i18n-tests.sh'
      - 'tests/bootstrap-tests.sh'
      - '.github/workflows/backup-tests.yml'
      - 'arch_multitool.sh'
      - 'arch_multitool_debian.sh'
      - 'bundle.sha256'
      - 'bundle.sha256.sig'
      - 'bundle.pub'
      - 'scripts/sign-bundle.sh'
      - 'modules/**'
      - 'config/**'
  pull_request:
    paths:
      - 'modules/lib/common.sh'
      - 'modules/lib/i18n.sh'
      - 'modules/actions/backup.sh'
      - 'modules/actions/uninstall.sh'
      - 'install/install.sh'
      - 'install/install_debian.sh'
      - 'tests/backup-tests.sh'
      - 'tests/i18n-tests.sh'
      - 'tests/bootstrap-tests.sh'
      - '.github/workflows/backup-tests.yml'
      - 'arch_multitool.sh'
      - 'arch_multitool_debian.sh'
      - 'bundle.sha256'
      - 'bundle.sha256.sig'
      - 'bundle.pub'
      - 'scripts/sign-bundle.sh'
      - 'modules/**'
      - 'config/**'
  workflow_dispatch:

jobs:
  bash-backup-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed bundle manifest
        run: bash scripts/sign-bundle.sh --check
      - name: Run backup regression tests
        run: bash tests/backup-tests.sh
      - name: Run i18n tests
        run: bash tests/i18n-tests.sh
      - name: Run bootstrap tests
        run: bash tests/bootstrap-tests.sh
